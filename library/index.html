<!-- Library -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/assets/img/logo.svg" />
    <title>Reezyee</title>
    <!-- <link href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css" rel="stylesheet"> -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/main.css" />
  </head>

  <body>
    <div class="cursor"></div>

    <main class="library-container cursor-none">
      <!-- BACK BUTTON -->
      <a
        href="javascript:void(0)"
        onclick="backToHome(event)"
        id="back"
        class="gsap-reveal fixed top-0 z-50 w-full bg-[#c7c1b6] flex justify-center items-end"
      >
        <svg
          class="lg:w-8 w-5"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
          <g
            id="SVGRepo_tracerCarrier"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></g>
          <g id="SVGRepo_iconCarrier">
            <path
              d="M5.70711 9.71069C5.31658 10.1012 5.31658 10.7344 5.70711 11.1249L10.5993 16.0123C11.3805 16.7927 12.6463 16.7924 13.4271 16.0117L18.3174 11.1213C18.708 10.7308 18.708 10.0976 18.3174 9.70708C17.9269 9.31655 17.2937 9.31655 16.9032 9.70708L12.7176 13.8927C12.3271 14.2833 11.6939 14.2832 11.3034 13.8927L7.12132 9.71069C6.7308 9.32016 6.09763 9.32016 5.70711 9.71069Z"
              fill="#153378"
            ></path>
          </g>
        </svg>
      </a>

      <section class="gallery-section gsap-reveal">
        <div class="gallery-sticky">
          <div class="gallery-track">
            <div id="library-gallery">
              <!-- <p class="text-[#c7c1b6]/50 font-comfortaa">Scroll Down</p> -->
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="/js/photo.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/CustomEase.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.5/dist/lenis.min.js"></script>
    <script src="https://unpkg.com/split-type"></script>
    <script src="/js/main.js"></script>
    <script type="module">
      gsap.registerPlugin(ScrollTrigger);

      await renderGallery("library-gallery");

      await Promise.all(
        [...document.querySelectorAll("#library-gallery img")].map((img) => {
          if (img.complete) return Promise.resolve();
          return new Promise((resolve) => {
            img.onload = resolve;
            img.onerror = resolve;
          });
        }),
      );

      const items = gsap.utils.toArray(".gallery-item");
      const gallery = document.querySelector("#library-gallery");
      let currentActive = -1;

      function getActiveWidth() {
        return window.innerWidth < 768 ? window.innerWidth * 0.85 : 720;
      }

      function getDistance() {
        const last = items[items.length - 1];
        if (!last) return 0;
        return (
          last.offsetLeft +
          (window.innerWidth < 768 ? last.offsetWidth * 0.85 : 720) / 2 -
          window.innerWidth / 2
        );
      }

      let horizontalTween;

      function initScroll() {
        const distance = getDistance();

        if (horizontalTween) horizontalTween.scrollTrigger.kill();

        horizontalTween = gsap.to(gallery, {
          x: -distance,
          ease: "none",
          scrollTrigger: {
            trigger: ".gallery-section",
            start: "top top",
            end: () => "+=" + (getDistance() + window.innerHeight), 
            pin: ".gallery-sticky", 
            scrub: 0.5,
            invalidateOnRefresh: true,
            anticipatePin: 1,
            onUpdate: updateCards,
          },
        });
      }

      initScroll();

      const tl = gsap.timeline();
      gsap.to(".gsap-reveal", {
        autoAlpha: 1,
        duration: 1.5,
        ease: "power2.out",
      });

      tl.from("#back", {
        height: 0,
        delay: 0.2,
        duration: 1,
      })
        .to(".library-container", {
          autoAlpha: 1,
          duration: 1.2,
          ease: "power2.out",
        })
        .from(
          ".gallery-img",
          {
            y: 150,
            opacity: 0,
            duration: 1.4,
            style: "transform",
            stagger: 0.15,
            ease: "power4.out",
          },
          "-=0.6",
        );

      function updateCards() {
        const viewportCenter = window.innerWidth / 2;
        let activeIndex = 0;
        let closest = Infinity;
        const activeWidth = getActiveWidth();

        items.forEach((item, i) => {
          const rect = item.getBoundingClientRect();
          const center = rect.left + rect.width / 2;
          const distance = Math.abs(center - viewportCenter);

          if (distance < closest) {
            closest = distance;
            activeIndex = i;
          }
        });

        if (activeIndex === currentActive) return;
        currentActive = activeIndex;

        items.forEach((item, i) => {
          const active = i === activeIndex;
          const img = item.querySelector("img");
          const desc = item.querySelector(".gallery-desc");
          const descB = item.querySelector(".gallery-desc-bottom");
          const baseWidth = window.innerWidth < 768 ? 140 : 180;

          gsap.to(item, {
            flexBasis: active ? activeWidth : baseWidth,
            duration: 0.6,
            ease: "power2.out",
            overwrite: "auto",
          });

          if (img) {  
            gsap.to(img, {
              opacity: active ? 1 : 0, 
              filter: active ? "blur(0px)" : "blur(3px)",
              duration: 0.6,
              ease: "power2.out",
              overwrite: "auto",
            });
          }

          if (desc) {
            gsap.to(desc, {
              opacity: active ? 1 : 0,
              y: active ? 0 : 10,
              height: active ? 10 : 0,
              duration: 0.5,
              ease: "power2.out",
              overwrite: "auto",
            });
          }
          if (descB) {
            gsap.to(descB, {
              opacity: active ? 1 : 0,
              y: active ? 0 : -10,
              duration: 0.5,
              ease: "power2.out",
              overwrite: "auto",
            });
          }
        });
      }

      window.addEventListener("resize", () => {
        initScroll();
        ScrollTrigger.refresh();
      });

      const isMobile = window.innerWidth < 768;
      const lenis = new Lenis({
        duration: 1.4,
        lerp: 0.08,
        smoothWheel: true,
        syncTouch: !isMobile,
      });

      lenis.on("scroll", ScrollTrigger.update);
      gsap.ticker.add((time) => {
        lenis.raf(time * 1000);
      });
      gsap.ticker.lagSmoothing(0);

      window.backToHome = (e) => {
        e.preventDefault();
        gsap.to("#back", {
          height: "100%",
          duration: 0.8,
          ease: "power4.inOut",
          onComplete() {
            document.body.style.background = "#c7c1b6";
            document.documentElement.style.background = "#c7c1b6";
            location.href = "/";
          },
        });
      };
    </script>
  </body>
</html>
