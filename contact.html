        <main id="main-content" class="main-content z-10">
            <div id="contact" class="relative">
                <a href="index.html" id="back" class="pointer-events-auto lg:text-3xl flex justify-end items-center font-comfortaa bg-[#c7c1b6] h-screen absolute top-0 right-0 z-50">
                    <svg class="lg:w-8 w-5" aria-hidden="true"

                <div class="flex flex-col justify-center items-center">
                    <p class="lg:text-6xl w-fit pt-20 text-2xl text-center font-unbounded cursor-scale">
                        HELLO.
                    </p>
                </div>
                <p class="lg:text-3xl mdt:ext-md text-center font-comfortaa">
                    Please, contact me as soon as you can!<br>Tell me about your idea.</p>
                <div class="card flex flex-col justify-center items-center">
                    <form id="contact-form" onsubmit="handleForm(event)" autocomplete="off">
                        <div class="input-group font-comfortaa">
                            <input type="text" name="from_name" required />
                            <label for="">Your Name</label>
                        </div>
                        <div class="input-group font-comfortaa">
                            <input type="email" name="reply_to" required />
                            <label for="">Your Email</label>
                        </div>
                        <div class="input-group font-comfortaa">
                            <textarea name="message" class="space-y-3 mt-2" required></textarea>
                            <label for="">Message</label>
                        </div>
                        <input type="submit" value="Send" class="btnEmail font-comfortaa" />
                    </form>
                </div>
                   <div class="flex flex-wrap gap-10 justify-center pt-10">

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/CustomEase.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.5/dist/lenis.min.js"></script>
    <script src="https://unpkg.com/split-type"></script>
    <script src="js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        (function () {
            emailjs.init('4U4r5pNtnvf2wv4EL');
        })();
    </script>
    <script>
        const handleForm = async (e) => {
        e.preventDefault(); // biar form nggak reload
        try {
            await emailjs.sendForm('service_54svtql', 'template_25h1c7r', document.getElementById('contact-form'));

            Swal.fire({
                icon: 'success',
                title: 'Email Sent!',
                text: 'Thank you for contacting me 😊',
                confirmButtonColor: '#3085d6',
                confirmButtonText: 'OK'
            });
        } catch (error) {
            Swal.fire({
                icon: 'error',
                title: 'Oops...',
                text: 'Something went wrong. Please try again!',
                confirmButtonColor: '#d33',
                confirmButtonText: 'Close'
            });
        }
    };

        gsap.from(".Contact_container", {
            clipPath: 'polygon(0% 0%, 0% 0%, 0% 100%, 0% 100%)',
            delay: 0.5
        })
        gsap.from("#back", {
            // x: 100,
            opacity: 0,
            width: 0,
            delay: 0.8,
            duration: 1
        })

        const lenis = new Lenis()

        lenis.on('scroll', (e) => {
        })

        function raf(time) {
            lenis.raf(time)
            requestAnimationFrame(raf)
        }

        requestAnimationFrame(raf)
    </script>
